[project]
name = "linkseed-cli"
version = "0.1.0-alpha"
description = "Command line client for the Linkseed API"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.27"]

[project.scripts]
linkseed = "linkseed_cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
